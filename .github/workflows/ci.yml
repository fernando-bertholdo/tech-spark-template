name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Invariantes do repositório: valem desde já, com código ou sem
      - name: Invariantes do repositório
        run: |
          test -f Projeto.md
          ! grep -rnE --exclude-dir=.git '^(<{7} |>{7} )' .
          ! git ls-files | grep -E '^\.multica/'

      # Os passos abaixo só rodam quando o stack correspondente existir no repo
      - uses: actions/setup-python@v5
        if: ${{ hashFiles('pyproject.toml', 'requirements.txt') != '' }}
        with:
          python-version: "3.12"

      - name: Testes Python
        if: ${{ hashFiles('pyproject.toml', 'requirements.txt') != '' }}
        run: |
          pip install -e ".[dev]" 2>/dev/null || pip install -r requirements.txt
          pytest -q

      - name: Testes Node
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          npm ci
          npm test
